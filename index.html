<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="혜기 화이팅">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b3b6f">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>혜기 화이팅</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#15202b; --dim:#6b7b8d; --line:#e2e8f0;
  --brand:#0b3b6f; --brand2:#1b6fc4; --ok:#128a5a; --okbg:#e6f6ee;
  --no:#c03030; --nobg:#fdeaea; --warn:#8a5a00; --warnbg:#fff6e0;
  --shadow:0 1px 2px rgba(16,32,56,.06),0 6px 18px rgba(16,32,56,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1419;--card:#172028;--ink:#e8eef5;--dim:#95a6b8;--line:#263340;
    --brand:#8cc2ff;--brand2:#5aa6f0;--ok:#5ad39b;--okbg:#10322a;
    --no:#ff8e8e;--nobg:#3a1c1c;--warn:#ffcf70;--warnbg:#3a2e12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 20px}
h1{font-size:19px;margin:2px 0 10px;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:block;width:100%;min-height:50px;padding:13px 16px;margin:8px 0;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;text-align:left;
  font-size:15.5px;line-height:1.4;transition:transform .06s,border-color .15s}
.btn:active{transform:scale(.985)}
.btn.sel{border-color:var(--brand2)}
.btn.good{border-color:var(--ok);background:var(--okbg)}
.btn.bad{border-color:var(--no);background:var(--nobg)}
.go{background:var(--brand);color:#fff;border:0;text-align:center;font-weight:600;font-size:16.5px}
@media (prefers-color-scheme:dark){.go{color:#07121c}}
.ghost{text-align:center;font-size:14.5px;min-height:44px;color:var(--dim)}
/* 상단 */
header{padding:10px 14px 0;display:flex;align-items:center;gap:8px}
header .t{font-weight:700;font-size:17px;flex:1;letter-spacing:-.3px}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
/* 칩바 */
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13.5px;padding:8px 13px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (prefers-color-scheme:dark){.chip.on{color:#07121c}}
/* 문제 */
.qmeta{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--dim)}
.tag.chk{background:var(--warnbg);color:var(--warn);border-color:transparent}
.q{font-size:18px;font-weight:600;line-height:1.5;margin:2px 0 14px;letter-spacing:-.2px}
.q b{color:var(--brand2)}
.ans{background:var(--okbg);border-radius:12px;padding:13px 14px;margin:4px 0 12px;font-size:16px;font-weight:600;color:var(--ok)}
.memo{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px;line-height:1.55}
.trap{background:var(--warnbg);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14.5px;line-height:1.55;color:var(--warn)}
.cheer{text-align:center;font-size:17px;font-weight:600;color:var(--ok);padding:6px 0 2px;min-height:26px}
/* 하단 탭 */
nav{display:flex;border-top:1px solid var(--line);background:var(--card);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 7px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--brand2);font-weight:600}
/* 기록 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile .n{font-size:26px;font-weight:700;letter-spacing:-1px}
.tile .l{font-size:12.5px;color:var(--dim);margin-top:2px}
.bar{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:999px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;gap:10px}
.row:last-child{border-bottom:0}
.list{font-size:15px;line-height:1.55}
.list .it{padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .a{color:var(--ok);font-weight:600}
.list .it .m{color:var(--dim);font-size:13.5px;margin-top:3px}
.hide{display:none}
</style>
</head>
<body>
<header><div class="t" id="htitle">혜기 화이팅</div><div class="pill" id="hstreak"></div></header>
<div id="main"></div>
<nav>
  <button id="t_quiz" onclick="showTab('quiz')"><span class="i">✏️</span>문제</button>
  <button id="t_list" onclick="showTab('list')"><span class="i">📋</span>모아보기</button>
  <button id="t_stat" onclick="showTab('stat')"><span class="i">📊</span>기록</button>
</nav>

/* ───── 저장 (뼈대 스키마 유지) ───── */
const KEY="hyegi.v1";
const BLANK={v:1,c:{},streak:0,last:"",total:0,pick:"due",dom:"",goal:12,done:0,dday:""};
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign({},BLANK,JSON.parse(r));}catch(e){}return JSON.parse(JSON.stringify(BLANK));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}

/* ───── 간격 반복 — 뼈대 그대로 [1,3,7,14,30] ───── */
const GAP=[1,3,7,14,30];
const EMPTY={n:0,due:"",miss:0,hide:0};
function st(id){return S.c[id]||(S.c[id]={n:0,due:"",miss:0,hide:0});}   // 쓰기용 (채점할 때만)
function rd(id){return S.c[id]||EMPTY;}                                    // 읽기용 (저장 안 늘림)
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function grade(id,ok){
  const s=st(id);
  if(ok){s.n=Math.min(s.n+1,5);}else{s.miss++;s.n=Math.max(0,s.n-1);}
  if(ok){
    const d=new Date(); d.setDate(d.getDate()+(GAP[Math.min(s.n,GAP.length)-1]||1));
    s.due=ymd(d);                 // 맞히면 1→3→7→14→30일 뒤
  }else{
    s.due=today();                // 틀리면 그날 안에 다시
  }
  const t=today();
  if(S.last!==t){ S.streak=(S.last&&daysBetween(S.last,t)===1)?S.streak+1:1; S.last=t; S.done=0; }
  S.total++; S.done++;
  save();
}
function knowIt(id){const s=st(id);s.n=Math.max(s.n,3);const d=new Date();d.setDate(d.getDate()+7);s.due=ymd(d);save();}

/* ───── 큐 — due → 새 카드, pick 4종 (뼈대 규칙) ───── */
function pool(){return CARDS.filter(c=>!rd(c.id).hide && (!S.dom||c.dom===S.dom));}
function queue(){
  const t=today(), p=pool();
  if(S.pick==="random") return shuffle(p);
  if(S.pick==="miss")   return p.filter(c=>rd(c.id).miss>0).sort((a,b)=>rd(b.id).miss-rd(a.id).miss);
  if(S.pick==="early")  return p.slice().sort((a,b)=>rd(a.id).n-rd(b.id).n);
  const due=p.filter(c=>rd(c.id).due && rd(c.id).due<=t).sort((a,b)=>rd(a.id).due<rd(b.id).due?-1:1);
  // 새 카드는 분야를 섞어서 — 한 세션이 한 분야로만 채워지면 지루하고 덜 외워진다
  const fresh=shuffle(p.filter(c=>!rd(c.id).due));
  return due.concat(fresh);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ───── 응원 한마디 ───── */
const CHEER=["좋아요 혜기님 👏","그거예요! 🎯","정확해요 ✨","오 잘 아시네요 💪","바로 그거 👍","착착 붙네요 🔥","합격 냄새 😎","기억 완벽 🧠"];
const NUDGE=["괜찮아요, 이제 외워졌어요 🙂","이게 바로 함정이에요 — 오늘 잡고 가요","틀린 게 남는 거예요 💡","한 번 더 보면 내 것 ✊"];
function pickOne(a){return a[Math.floor(Math.random()*a.length)];}

/* ───── 화면 ───── */
let tab="quiz", cur=null, curOpts=[], answered=false, sess=null;
const M=()=>document.getElementById("main");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}

function showTab(t){
  tab=t;
  document.querySelector("nav").hidden=false;
  ["quiz","list","stat"].forEach(k=>document.getElementById("t_"+k).className = k===t?"on":"");
  if(t==="quiz") drawQuiz(); else if(t==="list") drawList(); else drawStat();
}
function header(){
  const t=today();
  document.getElementById("hstreak").textContent =
    (S.streak>0 ? "🔥 "+S.streak+"일" : "시작해요") + (S.last===t&&S.done?" · 오늘 "+S.done+"장":"");
}

/* ── 문제 탭 ── */
function drawQuiz(){
  header();
  const m=M(); m.innerHTML="";
  const picks=[["due","추천"],["early","당겨 풀기"],["random","랜덤"],["miss","틀린 것"]];
  let chips='<div class="chips">';
  picks.forEach(([k,l])=>chips+=`<button class="chip ${S.pick===k?'on':''}" onclick="setPick('${k}')">${l}</button>`);
  chips+=`<button class="chip ${!S.dom?'on':''}" onclick="setDom('')">전체</button>`;
  DOMS.forEach(d=>chips+=`<button class="chip ${S.dom===d?'on':''}" onclick="setDom('${d}')">${d}</button>`);
  chips+="</div>";
  let secs='<div class="chips">';
  [[5,"5장"],[12,"12장"],[25,"25장"],[0,"제한 없이"]].forEach(([n,l])=>{
    const on = sess ? sess.cap===n : n===0;
    secs+=`<button class="chip ${on?'on':''}" onclick="startSess(${n})">${l}</button>`;
  });
  secs+='</div>';
  m.innerHTML=chips+secs+'<div id="qarea"></div>';
  nextCard();
}
function startSess(n){ sess = n? {cap:n,left:n} : null; drawQuiz(); }
function setPick(k){S.pick=k;save();sess=null;drawQuiz();}
function setDom(d){S.dom=d;save();sess=null;drawQuiz();}

function nextCard(){
  const q=queue();
  const area=document.getElementById("qarea");
  if(!q.length){ area.innerHTML=emptyBox(); return; }
  if(sess && sess.left<=0){ area.innerHTML=doneBox(); sess=null; return; }
  cur=q[0]; answered=false;
  drawCard(area,cur);
}
function emptyBox(){
  return `<div class="box"><div style="font-size:17px;font-weight:600;margin-bottom:6px">지금 꺼낼 카드가 없어요</div>
  <div class="sub" style="margin-bottom:12px">복습 예정이 아직 안 됐어요. 그래도 더 풀고 싶으면 👇</div>
  <button class="btn go" onclick="setPick('early')">당겨서 풀기</button>
  <button class="btn" onclick="setPick('random')">랜덤으로 풀기</button>
  <button class="btn" onclick="setPick('miss')">틀린 것만 다시</button>
  ${S.dom?`<button class="btn" onclick="setDom('')">전체 분야로 넓히기</button>`:""}</div>`;
}
function doneBox(){
  return `<div class="box" style="text-align:center">
  <div style="font-size:40px">🎉</div>
  <div style="font-size:18px;font-weight:700;margin:6px 0">오늘 분량 끝!</div>
  <div class="sub" style="margin-bottom:14px">${S.streak}일 연속이에요. 혜기님 잘하고 있어요 👏</div>
  <button class="btn go" onclick="sess=null;nextCard()">더 풀기</button></div>`;
}

function drawCard(area,c){
  const s=rd(c.id);
  const mode = (!c.opts||!c.opts.length) ? "recall" : (s.n>=2 ? "recall" : "choice");
  let h=`<div class="box"><div class="qmeta">
    <span class="tag">${esc(c.dom)}</span>
    <span class="tag">${c.src?esc(c.src):"#"+esc(c.no)}</span>
    ${c.chk?'<span class="tag chk">확인 필요</span>':''}
    ${s.n?`<span class="tag">${s.n}단계</span>`:'<span class="tag">새 카드</span>'}
    ${sess?`<span class="tag">남은 ${sess.left}장</span>`:''}
  </div>
  <div class="q">${md(c.q)}</div>`;

  if(mode==="choice"){
    curOpts=shuffle([c.a].concat(c.opts));
    curOpts.forEach((o,i)=>h+=`<button class="btn" id="o${i}" onclick="pickOpt(${i})">${esc(o)}</button>`);
  }else{
    h+=`<div class="sub" style="margin-bottom:10px">머릿속으로 답해 보고 눌러 주세요</div>
        <button class="btn go" onclick="reveal()">정답 보기</button>`;
  }
  h+=`<button class="btn ghost" onclick="skipIt()">👌 이건 알아요 · 나중에</button></div>
      <div id="back"></div>`;
  area.innerHTML=h;
}
function pickOpt(i){
  if(answered)return; answered=true;
  const ok = curOpts[i]===cur.a;
  curOpts.forEach((o,j)=>{
    const b=document.getElementById("o"+j); if(!b)return;
    b.onclick=null;
    if(o===cur.a) b.className="btn good";
    else if(j===i) b.className="btn bad";
  });
  grade(cur.id,ok); back(ok);
}
function reveal(){
  if(answered||!document.getElementById("back"))return; answered=true;
  document.getElementById("back").innerHTML=
   `<div class="box"><div class="ans">${esc(cur.a)}</div>
    <div class="sub" style="margin-bottom:10px">맞혔나요?</div>
    <button class="btn good" onclick="selfGrade(true)">⭕️ 맞혔어요</button>
    <button class="btn bad" onclick="selfGrade(false)">❌ 틀렸어요</button></div>`;
  document.getElementById("back").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function selfGrade(ok){grade(cur.id,ok);back(ok,true);}
function back(ok,skipAns){
  const el=document.getElementById("back"); if(!el||!cur) return;   // 카드가 없는 화면에서 호출돼도 안전하게
  const c=cur;
  let h=`<div class="box">
    <div class="cheer">${ok?pickOne(CHEER):pickOne(NUDGE)}</div>
    ${skipAns?"":`<div class="ans">${esc(c.a)}</div>`}
    <div class="memo">${md(c.memo)}</div>
    ${c.trap?`<div class="trap">⚠️ ${md(c.trap)}</div>`:""}
    ${c.chk?`<div class="sub" style="margin-bottom:10px">ⓘ 이 항목은 메모만으로 수치를 단정할 수 없어요. 교재에서 한 번 확인하세요.</div>`:""}
    <button class="btn go" onclick="advance()">다음 →</button>
    <button class="btn ghost" onclick="hideCard()">🚫 이 카드는 이제 안 볼래요</button>
  </div>`;
  el.innerHTML=h;
  if(sess)sess.left--;
  header();
  el.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function advance(){nextCard();M().scrollTop=0;}
function skipIt(){knowIt(cur.id);nextCard();M().scrollTop=0;}
function hideCard(){st(cur.id).hide=1;save();nextCard();M().scrollTop=0;}

/* ── 모아보기 탭 ── */
function drawList(){
  header();
  let h=`<h1>모아보기</h1><div class="sub" style="margin-bottom:10px">문제를 풀지 않고 쭉 읽기 — 자기 전에 훑어보기 좋아요</div>`;
  h+='<div class="chips">';
  h+=`<button class="chip ${!S.dom?'on':''}" onclick="setDomList('')">전체</button>`;
  DOMS.forEach(d=>h+=`<button class="chip ${S.dom===d?'on':''}" onclick="setDomList('${d}')">${d}</button>`);
  h+="</div>";
  const cs=CARDS.filter(c=>!S.dom||c.dom===S.dom);
  h+=`<div class="box list">`;
  cs.forEach(c=>{h+=`<div class="it"><div>${md(c.q)}</div>
    <div class="a">→ ${esc(c.a)}</div>
    <div class="m">${md(c.memo)}</div>
    ${c.trap?`<div class="m" style="color:var(--warn)">⚠️ ${md(c.trap)}</div>`:""}</div>`;});
  h+=`</div>`;
  M().innerHTML=h; M().scrollTop=0;
}
function setDomList(d){S.dom=d;save();drawList();}

/* ── 기록 탭 ── */
function drawStat(){
  header();
  const all=CARDS.length;
  const seen=CARDS.filter(c=>rd(c.id).n>0).length;
  const solid=CARDS.filter(c=>rd(c.id).n>=3).length;
  const miss=CARDS.filter(c=>rd(c.id).miss>0).length;
  const hid=CARDS.filter(c=>rd(c.id).hide).length;
  let h=`<h1>기록</h1>
  <div class="grid">
    <div class="tile"><div class="n">${S.streak}</div><div class="l">🔥 연속 공부일</div></div>
    <div class="tile"><div class="n">${S.total}</div><div class="l">지금까지 푼 장</div></div>
  </div>
  <div class="box">
    <div class="row"><span>한 번 이상 본 카드</span><b>${seen} / ${all}</b></div>
    <div class="bar"><i style="width:${all?Math.round(seen/all*100):0}%"></i></div>
    <div class="row" style="margin-top:8px"><span>3단계 이상 (외워진 카드)</span><b>${solid} / ${all}</b></div>
    <div class="bar"><i style="width:${all?Math.round(solid/all*100):0}%;background:var(--ok)"></i></div>
  </div>
  <div class="box"><div style="font-weight:600;margin-bottom:6px">분야별</div>`;
  DOMS.forEach(d=>{
    const cs=CARDS.filter(c=>c.dom===d);
    const k=cs.filter(c=>rd(c.id).n>=3).length;
    h+=`<div class="row"><span>${d}</span><b>${k} / ${cs.length}</b></div>
        <div class="bar"><i style="width:${cs.length?Math.round(k/cs.length*100):0}%"></i></div>`;
  });
  h+=`</div>
  <div class="box">
    <div class="row"><span>틀린 적 있는 카드</span><b>${miss}장</b></div>
    ${hid?`<div class="row"><span>숨긴 카드 ${hid}장</span><button class="chip" onclick="unhide()">다시 보기</button></div>`:""}
    <div class="row"><span>버전</span><span class="sub">${VER}</span></div>
  </div>
  <button class="btn ghost" onclick="reset()">기록 초기화</button>`;
  M().innerHTML=h; M().scrollTop=0;
}
function unhide(){CARDS.forEach(c=>{if(S.c[c.id])S.c[c.id].hide=0;});save();drawStat();}
function reset(){
  if(!confirm("지금까지의 학습 기록을 모두 지웁니다. 괜찮아요?"))return;
  S=JSON.parse(JSON.stringify(BLANK));save();showTab("quiz");
}

/* 안드로이드 래퍼용 뒤로가기 (아이폰에서는 안 쓰임) */
window.appBack=function(){
  if(tab!=="quiz"){showTab("quiz");return true;}
  return false;
};

/* ───── 잠금 해제 (암호로 잠가 배포한 경우) ─────
   내용은 AES-GCM으로 암호화돼 있어서 암호 없이는 파일을 받아도 못 읽는다.
   한 번 풀면 암호를 이 폰에만 저장해 두고 다음부터는 바로 열린다. */
const PKEY="hyegi.key";      // 한 번 푼 뒤에는 '유도된 키'를 저장한다 — 다음부터 PBKDF2를 건너뛰어 즉시 열림
function b64(x){return Uint8Array.from(atob(x),c=>c.charCodeAt(0));}
function toB64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}

async function keyFromPass(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits(
    {name:"PBKDF2",salt:b64(LOCK.s),iterations:LOCK.n,hash:"SHA-256"},base,256);
  return bits;                                   // raw 32바이트
}
async function decryptWith(rawKey){
  const key=await crypto.subtle.importKey("raw",rawKey,{name:"AES-GCM"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(LOCK.i)},key,b64(LOCK.c));
  const data=JSON.parse(new TextDecoder().decode(plain));
  CARDS=data.cards; DOMS=data.doms;
}
function lockScreen(msg,busy){
  document.getElementById("hstreak").textContent="";
  document.querySelector("nav").hidden=true;          // 잠겨 있는 동안은 탭을 숨긴다
  M().innerHTML=`<div class="box" style="margin-top:18vh;text-align:center">
    <div style="font-size:40px">🎀</div>
    <div style="font-size:19px;font-weight:700;margin:8px 0 4px">혜기 화이팅</div>
    <div class="sub" style="margin-bottom:16px" id="lmsg">${msg||"암호를 넣어 주세요"}</div>
    ${busy?'<div class="sub">잠시만요… 처음 한 번만 걸립니다</div>':`
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password"
      placeholder="암호" style="width:100%;min-height:50px;padding:13px 16px;font:inherit;
      border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);text-align:center">
    <button class="btn go" style="margin-top:12px" onclick="tryUnlock()">열기</button>`}
  </div>`;
  if(!busy){
    const i=document.getElementById("pw");
    i.addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
    setTimeout(()=>i.focus(),150);
  }
}
async function tryUnlock(){
  const v=document.getElementById("pw").value;
  if(!v)return;
  lockScreen("여는 중…",true);
  await new Promise(r=>setTimeout(r,30));     // 화면이 먼저 그려지도록
  try{
    const raw=await keyFromPass(v);
    await decryptWith(raw);
    try{localStorage.setItem(PKEY,toB64(raw));}catch(e){}
    showTab("quiz");
  }catch(e){ lockScreen("암호가 맞지 않아요. 다시 해 볼까요?"); }
}
async function boot(){
  if(!LOCK){ showTab("quiz"); return; }
  let saved=null; try{saved=localStorage.getItem(PKEY);}catch(e){}
  if(saved){ try{ await decryptWith(b64(saved)); showTab("quiz"); return; }catch(e){} }
  lockScreen();
}
boot();

/* 서비스워커 — 홈 화면에 추가한 뒤에는 네트워크 없이 열린다 */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
    reg.update();                                  // 열 때마다 새 버전 확인
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      nw && nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) location.reload();
      });
    });
  }).catch(()=>{}));
}
